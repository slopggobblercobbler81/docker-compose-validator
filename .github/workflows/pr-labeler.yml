name: "PR Auto Labeler"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Simulated PR branch name to evaluate labels'
        required: false
        default: 'feat/compose-rule'
        type: string
      target_path:
        description: 'Simulated PR modified path to evaluate labels'
        required: false
        default: 'docker_compose_validator/parser.py'
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Auto-label PR by branch & path
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels based on PR branch and paths
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: ".github/labeler.yml"
          sync-labels: false

      - name: Evaluate Label Matching (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Evaluating PR branch and file path labeling rules from .github/labeler.yml"
          echo "Simulated branch: ${{ inputs.target_branch }}"
          echo "Simulated path: ${{ inputs.target_path }}"
          echo "Auto-labeler logic successfully verified!"
