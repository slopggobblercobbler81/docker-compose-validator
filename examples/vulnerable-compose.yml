version: "3.8"

services:
  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "insecure_plaintext_password"
      POSTGRES_DB: "production"

  redis:
    image: redis
    ports:
      - "0.0.0.0:6379:6379"

  admin_worker:
    image: alpine:latest
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    network_mode: host
    container_name: static_admin_worker
